name: Crawl, validate, and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      full_crawl:
        description: Refresh all candidates from 2020
        type: boolean
        default: true

concurrency:
  group: dbms-testing-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Preserve validation baseline
        run: cp data/curated/papers.json /tmp/dbms-papers-baseline.json
      - name: Select daily crawl year
        if: github.event_name == 'schedule'
        id: rotation
        run: |
          current_year=$(date -u +%Y)
          span=$((current_year - 2020 + 1))
          crawl_year=$((2020 + (10#$(date -u +%j) - 1) % span))
          echo "year=$crawl_year" >> "$GITHUB_OUTPUT"
      - name: Fetch daily candidates
        if: github.event_name == 'schedule'
        run: python scripts/fetch_papers.py --from-year "${{ steps.rotation.outputs.year }}" --to-year "${{ steps.rotation.outputs.year }}" --per-query 100 --arxiv-results 50 --sleep 1
      - name: Fetch full candidates
        if: inputs.full_crawl
        run: python scripts/fetch_papers.py --from-year 2020 --per-query 100 --arxiv-results 50 --sleep 1
      - name: Process and validate
        run: |
          python scripts/process_papers.py
          python scripts/update_readme.py
          python scripts/build_site.py
          python scripts/validate_dataset.py --baseline /tmp/dbms-papers-baseline.json
          python -m unittest discover -s tests -v
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || inputs.full_crawl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data web/index.html
          git diff --cached --quiet || git commit -m "data: refresh DBMS testing papers"
          git push
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
